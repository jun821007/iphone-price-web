<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>VIP 審核後台</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body>
  <div class="page">
    <header class="header">
      <h1 class="admin-title">VIP 審核後台</h1>
      <a class="admin-link" href="index.html">← 回報價查詢</a>
    </header>

    <section id="reviewPanel">
      <section class="card brand-manager">
        <h2 class="section-title">品牌管理（動態新增）</h2>
        <div class="filters">
          <div class="filter-row grow">
            <label for="newBrandName">新品牌名稱</label>
            <input id="newBrandName" type="text" placeholder="例如 Huawei、小米" />
          </div>
          <button id="addBrandBtn" type="button" class="btn-secondary">新增品牌</button>
        </div>
        <div id="brandList" class="brand-list muted">載入中…</div>
      </section>

      <div class="filters card">
        <div class="filter-row">
          <label for="pendingDate">日期</label>
          <select id="pendingDate"></select>
        </div>
        <button id="refreshPendingBtn" type="button" class="btn-primary">重新載入待審</button>
      </div>
      <div id="pendingList" class="pending-list"></div>
    </section>
  </div>
  <script src="admin.js?v=2"></script>
</body>
</html>
