<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a2744" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="報價查詢" />
  <title>報價查詢</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body>
  <div class="page">
    <header class="header">
      <p id="lastUpdated" class="last-updated">最後同步：—</p>
      <a class="admin-link" href="admin.html">審計後台</a>
    </header>

    <section id="dashboard" class="dashboard card">
      <details class="collapse-section" open>
        <summary class="collapse-summary section-title">今日打卡儀表板</summary>
        <div class="collapse-body">
          <div class="stat-grid">
            <div class="stat-box"><div class="stat-label">訊息數</div><div id="statMessages" class="stat-value">—</div></div>
            <div class="stat-box"><div class="stat-label">觀測筆數</div><div id="statObservations" class="stat-value">—</div></div>
            <div class="stat-box"><div class="stat-label">商品規格</div><div id="statRecords" class="stat-value">—</div></div>
            <div class="stat-box highlight"><div class="stat-label">報價總次數</div><div id="statQuotes" class="stat-value">—</div></div>
          </div>
        </div>
      </details>
    </section>

    <section class="card">
      <details class="collapse-section">
        <summary class="collapse-summary section-title">情報來源排行（跨群累計）</summary>
        <div class="collapse-body">
          <ol id="senderLeaderboard" class="rank-list"></ol>
        </div>
      </details>
    </section>

    <section class="card">
      <details class="collapse-section">
        <summary class="collapse-summary section-title">機型熱度排行（報價次數，同一人可累加）</summary>
        <div class="collapse-body">
          <ol id="modelLeaderboard" class="rank-list"></ol>
        </div>
      </details>
    </section>

    <section class="card">
      <details class="collapse-section">
        <summary class="collapse-summary section-title">日期・搜尋型號</summary>
        <div class="collapse-body filters">
          <div class="filter-row">
            <label for="dateSelect">日期</label>
            <select id="dateSelect"><option value="">載入中…</option></select>
          </div>
          <div class="filter-row grow">
            <label for="searchInput">搜尋型號</label>
            <input id="searchInput" type="search" placeholder="例如 17pro、AirPodsPro3" />
          </div>
          <button id="reloadBtn" type="button" class="btn-primary">重新載入</button>
        </div>
      </details>
    </section>

    <nav class="tabs" id="categoryTabs" role="tablist">
      <button type="button" class="tab active" data-category="new" aria-selected="true">新機</button>
      <button type="button" class="tab" data-category="used" aria-selected="false">二手</button>
      <button type="button" class="tab" data-category="accessory" aria-selected="false">配件</button>
      <button type="button" class="tab" data-category="new_ipad" aria-selected="false">iPad</button>
    </nav>

    <section id="summary" class="summary card"></section>

    <section class="card table-wrap">
      <div id="compactPriceList" class="compact-price-list"></div>
      <table hidden>
        <thead>
          <tr>
            <th>方向</th>
            <th>型號</th>
            <th>容量</th>
            <th>顏色</th>
            <th>建議售價</th>
            <th>熱門價</th>
            <th>目前折數</th>
            <th>總次數</th>
            <th>價格分布</th>
          </tr>
        </thead>
        <tbody id="tableBody"><tr><td colspan="9" class="muted">請選擇日期</td></tr></tbody>
      </table>
    </section>
  </div>

  <dialog id="detailModal" class="detail-modal">
    <div class="detail-panel">
      <header class="detail-header">
        <div>
          <h2 id="detailTitle" class="detail-title">—</h2>
          <p id="detailSubtitle" class="detail-subtitle muted"></p>
        </div>
        <button type="button" id="detailClose" class="btn-secondary detail-close" aria-label="關閉">✕</button>
      </header>
      <div class="detail-stats" id="detailStats"></div>
      <section class="detail-classify card">
        <details class="detail-classify-details">
          <summary class="detail-section-title detail-classify-summary">分類修正</summary>
          <p id="classifyCurrent" class="classify-current muted"></p>
          <div class="pending-bind-grid" id="classifyForm">
            <label>型號<select id="classifyBaseModel"></select></label>
            <label>容量<select id="classifyCapacity"></select></label>
            <label>顏色<select id="classifyColor"></select></label>
            <label>品牌<select id="classifyBrand"></select></label>
            <label>新舊<select id="classifyCondition"></select></label>
          </div>
          <button type="button" id="classifySave" class="btn-primary classify-save">儲存分類</button>
          <p id="classifyStatus" class="classify-status muted" aria-live="polite"></p>
        </details>
      </section>
      <div class="detail-ticks-wrap">
        <h3 class="detail-section-title">報價統計次數（同一人不累加）</h3>
        <div id="detailTicks" class="detail-ticks muted">載入中…</div>
      </div>
      <div class="detail-chart-wrap">
        <canvas id="priceChart" aria-label="歷史價格走勢"></canvas>
      </div>
      <div class="detail-chart-wrap">
        <canvas id="discountChart" aria-label="歷史折數走勢"></canvas>
      </div>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="app.js?v=19"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    }
  </script>
</body>
</html>
